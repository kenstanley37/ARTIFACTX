name: Feature Request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: what
    attributes:
      label: What would you like to see?
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why would this be useful?
      description: What's the use case or problem this solves?
    validations:
      required: false

  - type: input
    id: page
    attributes:
      label: Which page/feature does this relate to?
      description: e.g. Exosuit, Multi-Tool, Starships, Freighter, Base Storage, Corvette Cache, or "New page"
    validations:
      required: false
