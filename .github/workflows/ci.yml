name: CI

on:
  pull_request:
    branches:
      - main
      - development
  push:
    branches:
      - development

jobs:
  check-and-build:
    name: Check and Build
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run Core Checks
        run: dotnet run --project tests/ArtifactX.Core.Checks

      - name: Build ArtifactX.WinUI3 (win-x64)
        run: dotnet build src/ArtifactX.WinUI3/ArtifactX.WinUI3.csproj -c Release -p:Platform=x64 -r win-x64
